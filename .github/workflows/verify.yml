name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: careway_test
          POSTGRES_USER: careway_test
          POSTGRES_PASSWORD: careway_ci_only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U careway_test -d careway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: bash ./mvnw -B test
      - name: Verify booking with PostgreSQL
        run: bash ./mvnw -B test
        env:
          CAREWAY_TEST_DB_URL: jdbc:postgresql://localhost:${{ job.services.postgres.ports[5432] }}/careway_test
          CAREWAY_TEST_DB_USERNAME: careway_test
          CAREWAY_TEST_DB_PASSWORD: careway_ci_only

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
